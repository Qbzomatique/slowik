name: Testy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hasła zgodne z words.js i poprawne
        if: ${{ !cancelled() }}
        run: python3 tests/test_hasla.py

      - name: Kolorowanie prób
        if: ${{ !cancelled() }}
        run: node tests/test_score.js

      - name: Konto i słowo dnia (logika klienta, atrapa Supabase)
        if: ${{ !cancelled() }}
        run: node tests/test_online.js

      - name: Składnia index.html i words.js
        if: ${{ !cancelled() }}
        run: node tests/test_skladnia.js
